# Generated by tmux.app Config Generator
# https://tmux.app/#config-generator

# ── Prefix Key ──────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Keymaps ──────────────────────────

# reload tmux config
unbind r
bind r source-file ~/.tmux.conf

# navigation
bind h select-pane -L
bind n select-pane -D
bind e select-pane -U
bind i select-pane -R

bind -T copy-mode-vi n send -X cursor-down
bind -T copy-mode-vi e send -X cursor-up
bind -T copy-mode-vi h send -X cursor-left
bind -T copy-mode-vi i send -X cursor-right
bind -T copy-mode-vi C-s send -X halfpage-down

bind -T copy-mode-vi k send-keys -X search-again
bind -T copy-mode-vi K send-keys -X search-reverse

bind -T root n if -F "#{==:#{pane_mode},tree-mode}" "send Down" "send n"
bind -T root e if -F "#{==:#{pane_mode},tree-mode}" "send Up" "send e"

# ── General Settings ─────────────────────
set -g mouse on
set -g mode-keys vi
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -g extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ',*:extkeys'
# set -as terminal-features 'xterm*:extkeys'

# ── Status Bar ────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-left " #[bold]#S #[nobold]| "
set -g status-left-length 30
set -g status-right " %H:%M    %d-%b "

# ── Terminal Colors ──────────────────────
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0


# ── TPM Plugin Manager ───────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'Morantron/tmux-fingers'
run '~/.tmux/plugins/tpm/tpm'
